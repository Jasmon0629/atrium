# Standalone Atrium stack on its own instance: PostgreSQL + app + Caddy.
# Caddy owns ports 80/443 and terminates HTTPS (Let's Encrypt, automatic once
# the DNS A record for ATRIUM_HOST points at this box). The plain-HTTP site on
# ATRIUM_IP makes the app reachable before DNS exists.
# Secrets and host settings live in .env next to this file (see deploy/bootstrap.sh).

# Container logs are capped (3 x 10 MB per service) so a chatty week can never
# fill the 20 GB disk. `docker compose logs` still works as usual.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    container_name: aidev-atrium-db
    restart: unless-stopped
    logging: *default-logging
    # 512 MB instance: keep PostgreSQL's footprint small
    command: postgres -c shared_buffers=64MB -c max_connections=40
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atrium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atrium -d atrium']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  atrium:
    build: .
    container_name: aidev-atrium
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4600
      DATABASE_URL: postgres://atrium:${POSTGRES_PASSWORD}@db:5432/atrium
      ATRIUM_SECRET: ${ATRIUM_SECRET:?set ATRIUM_SECRET in .env}
      # hostnames Caddy serves -> CORS allowlist (see corsOrigins in server/src/app.js)
      ATRIUM_HOST: ${ATRIUM_HOST:-aidev.asmtech.international}
      ATRIUM_IP: ${ATRIUM_IP:-}
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: aidev-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - atrium
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ATRIUM_HOST: ${ATRIUM_HOST:-aidev.asmtech.international}
      ATRIUM_IP: ${ATRIUM_IP:-56.69.175.201}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal: {}
